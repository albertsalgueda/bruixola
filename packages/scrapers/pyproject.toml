[project]
name = "bruixola-scrapers"
version = "0.1.0"
description = "Catalan real-estate scrapers for Brúixola"
requires-python = ">=3.12"
authors = [
  { name = "Albert Salgueda", email = "albert@krea.ai" },
]
dependencies = [
  # HTTP + parsing
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  # JS-rendered fallback
  "playwright>=1.48.0",
  # Schemas (codegened from packages/shared/schema/)
  "pydantic>=2.9.0",
  # Local DB + Parquet
  "duckdb>=1.1.0",
  "polars>=1.10.0",
  # Geo
  "shapely>=2.0.6",
  # Misc
  "python-slugify>=8.0.4",
  "tenacity>=9.0.0",
  "rich>=13.9.0",
  "typer>=0.13.0",
  # Build-time codegen — kept in main deps because schema:gen runs frequently
  # and we want it available right after `uv sync`.
  "datamodel-code-generator>=0.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
]

[project.scripts]
bruixola-scrape = "bruixola_scrapers.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bruixola_scrapers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]  # too-many-arguments — fine for typer commands

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
